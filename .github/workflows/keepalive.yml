# Optional backup keep-alive that does not depend on where the app is hosted.
# It only does anything once you add SUPABASE_URL and SUPABASE_ANON_KEY as repository secrets
# (GitHub: Settings > Secrets and variables > Actions).
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets not set, skipping."
            exit 0
          fi
          for table in statuses customers tickets; do
            curl -fsS "$SUPABASE_URL/rest/v1/$table?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" > /dev/null
            echo "Queried $table"
          done
